<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyShare - Swap Study Notes</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #E0E0E0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background-color: #1E1E1E;
      width: 100%;
      max-width: 520px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      position: relative;
    }

    /* Auth Screens Styles */
    #auth-container { display: none; }
    #main-content { display: none; }
    
    .auth-title { font-size: 24px; color: #FFFFFF; font-weight: 700; margin-bottom: 25px; }
    .auth-input-group { text-align: left; margin-bottom: 15px; }
    .auth-input-group label { display: block; font-size: 13px; color: #A0A0A0; margin-bottom: 5px; }
    .auth-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4A5568; background-color: #2D3748; color: #E0E0E0; }
    .auth-btn-group { display: flex; gap: 10px; margin-top: 20px; }
    
    #logout-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #A0A0A0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    #logout-btn:hover { color: #FFFFFF; }
    /* -------------------- */

    .icon-header { font-size: 48px; margin-bottom: 12px; }
    h1 { color: #FFFFFF; font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    p.subtitle { color: #A0A0A0; font-size: 15px; margin-bottom: 20px; }

    .credit-badge {
      display: inline-block;
      background-color: #2D3748;
      color: #90CDF4;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .file-dropzone {
      border: 2px dashed #4A5568;
      border-radius: 12px;
      padding: 25px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #2D3748;
      margin-bottom: 18px;
    }
    .file-dropzone:hover { border-color: #63B3ED; background-color: #3A4A63; }
    .file-dropzone label { cursor: pointer; display: block; color: #E0E0E0; font-weight: 500; }
    input[type="file"] { display: none; }
    #file-name { display: block; margin-top: 8px; font-size: 13px; color: #90CDF4; font-weight: 600; word-break: break-all; }

    .btn {
      width: 100%;
      background-color: #4F46E5;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn:hover { background-color: #4338CA; }

    #message { margin-top: 15px; font-size: 14px; font-weight: 500; }

    .search-container {
      margin-bottom: 20px;
      text-align: left;
    }
    #search-bar {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #4A5568;
      background-color: #2D3748;
      color: #E0E0E0;
      font-size: 14px;
    }
    #search-bar::placeholder { color: #A0A0A0; }

    .doc-item {
      background-color: #2D3748;
      border: 1px solid #4A5568;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      gap: 15px;
      align-items: center;
      text-align: left;
    }
    .file-icon {
      font-size: 32px;
      width: 40px;
      text-align: center;
    }
    .doc-details { flex-grow: 1; }
    .doc-title { font-weight: 600; color: #FFFFFF; font-size: 14px; word-break: break-all; }
    .doc-rating { font-size: 12px; color: #F6AD55; margin-top: 4px; }
    
    .action-group { text-align: right; }
    .download-btn {
      background-color: #10B981;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .download-btn:hover { background-color: #059669; }

    .star-rating { cursor: pointer; color: #4A5568; }
    .star-rating:hover, .star-rating.active { color: #F6AD55; }

    #qrcode {
      display: flex;
      justify-content: center;
      padding: 10px;
      background-color: #FFFFFF;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <div id="auth-container">
      <div class="icon-header">📚</div>
      <p class="auth-title">Welcome to StudyShare</p>
      
      <div class="auth-input-group">
        <label>Institutional / Authentic Email</label>
        <input type="email" id="auth-email" class="auth-input" placeholder="you@university.edu" />
      </div>
      
      <div class="auth-input-group">
        <label>Password</label>
        <input type="password" id="auth-password" class="auth-input" placeholder="••••••••" />
      </div>
      
      <p id="auth-message" style="margin-top:10px; font-size:13px;"></p>
      
      <div class="auth-btn-group">
        <button class="btn" style="background-color:#2D3748; flex:1;" onclick="handleSignUp()">Sign Up</button>
        <button class="btn" style="flex:1;" onclick="handleSignIn()">Sign In</button>
      </div>
    </div>
    <div id="main-content">
      <button id="logout-btn" onclick="handleSignOut()">Logout</button>
      
      <div class="icon-header">📚</div>
      <h1>StudyShare</h1>
      <p class="subtitle">Upload 3 study documents to earn 1 download credit!</p>
      
      <div class="credit-badge">
        ⚡ Available Downloads: <span id="credit-count">0</span>
      </div>

      <div id="upload-section">
        <div class="file-dropzone" onclick="document.getElementById('file-input').click()">
          <label>📄 Select a Study File (.pdf, .docx, .txt, .pptx)</label>
          <span id="file-name">No file chosen</span>
          <input type="file" id="file-input" accept=".pdf,.docx,.doc,.txt,.pptx" onchange="updateFileName()" />
        </div>

        <button class="btn" onclick="uploadAndUnlock()">Upload Document</button>
      </div>

      <p id="message"></p>

      <hr style="margin: 25px 0; border: none; border-top: 1px solid #4A5568;" />

      <h3 style="text-align: left; font-size: 16px; color: #FFFFFF; margin-bottom: 12px;">Available Documents:</h3>
      
      <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search by document title (e.g. 'maths')..." onkeyup="fetchDocuments()">
      </div>
      
      <div id="document-list"></div>

      <hr style="margin: 25px 0; border: none; border-top: 1px solid #4A5568;" />

      <div style="margin-top: 20px; padding: 15px; background-color: #2D3748; border-radius: 12px; border: 1px solid #4A5568;">
        <p style="font-size: 13px; color: #A0A0A0; font-weight: 600; margin-bottom: 10px;">📱 Scan to open on mobile:</p>
        <div id="qrcode"></div>
      </div>
    </div>
    </div>

  <script>
    const SUPABASE_URL = "https://jskfhnjqzrfvnsnnivtt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impza2ZobmpxenJmdm5zbm5pdnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjE5MjAsImV4cCI6MjEwMTI5NzkyMH0.oKMohbhY9cNvr7Rt7iLgea_hg48y1zzaFTcK0wj53YU"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- Part 3: Auth Handler Logic ---
    const authContainer = document.getElementById('auth-container');
    const mainContent = document.getElementById('main-content');
    const authMessage = document.getElementById('auth-message');

    // On Load: Check if user is already signed in
    window.onload = async function() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        showMainContent();
      } else {
        showAuthContainer();
      }
    };

    function showMainContent() {
      authContainer.style.display = 'none';
      mainContent.style.display = 'block';
      // Load user economy data and generate QR
      updateCreditDisplay();
    }

    function showAuthContainer() {
      mainContent.style.display = 'none';
      authContainer.style.display = 'block';
      generateQRCode(); // QR can show on auth page
    }

    async function handleSignUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      authMessage.style.color = '#E0E0E0';
      authMessage.innerText = 'Creating account...';

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        authMessage.style.color = '#ef4444';
        authMessage.innerText = `Error: ${error.message}`;
      } else {
        authMessage.style.color = '#68D391';
        authMessage.innerText = 'Success! Please check your email for the confirmation link.';
      }
    }

    async function handleSignIn() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      authMessage.style.color = '#E0E0E0';
      authMessage.innerText = 'Signing in...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        authMessage.style.color = '#ef4444';
        authMessage.innerText = `Error: ${error.message}`;
      } else {
        showMainContent();
      }
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      window.location.reload(); // Reload to show auth screen
    }
    // ---------------------------------

    // --- Existing Logic --- 
    const UPLOADS_PER_CREDIT = 3; 
    
    function getUserId() {
      // In a real app, you'd use user.id to track credits in Supabase db
      // We are still using localStorage for credits for now
      return localStorage.getItem('studyShare_currentUser') || 'anonymous';
    }

    let userCredits = parseInt(localStorage.getItem('studyShareCredits')) || 0; 
    let userUploadProgress = parseInt(localStorage.getItem('studyShareProgress')) || 0; 

    function updateCreditDisplay() {
      document.getElementById('credit-count').innerText = userCredits;
      localStorage.setItem('studyShareCredits', userCredits);
      localStorage.setItem('studyShareProgress', userUploadProgress); 
    }

    function updateFileName() {
      const input = document.getElementById('file-input');
      const fileNameSpan = document.getElementById('file-name');
      if (input.files.length > 0) {
        fileNameSpan.innerText = input.files[0].name;
      }
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (ext === 'pdf') return '📕';
      if (['doc', 'docx'].includes(ext)) return '📘';
      if (ext === 'txt') return '📄';
      if (ext === 'pptx') return '📙';
      return '📄';
    }

    function getRatingStars(rating) {
      let starsHtml = '';
      const roundedRating = Math.round(rating * 2) / 2;
      for (let i = 1; i <= 5; i++) {
        if (i <= roundedRating) { starsHtml += '★'; } 
        else { starsHtml += '☆'; } 
      }
      return `${starsHtml} (${rating > 0 ? rating.toFixed(1) : 'No'} ratings)`;
    }

    async function submitRating(documentId, score) {
      if (localStorage.getItem(`rated_${documentId}`)) {
        alert("You have already rated this document.");
        return;
      }

      const { data: doc, error: fetchError } = await supabaseClient
        .from('documents')
        .select('total_rating_score, rating_count')
        .eq('id', documentId)
        .single();

      if (fetchError) return;

      const newScore = (doc.total_rating_score || 0) + score;
      const newCount = (doc.rating_count || 0) + 1;

      await supabaseClient
        .from('documents')
        .update({ total_rating_score: newScore, rating_count: newCount })
        .eq('id', documentId);

      localStorage.setItem(`rated_${documentId}`, 'true');
      alert("Thank you for your rating!");
      fetchDocuments();
    }

    async function fetchDocuments() {
      const searchTerm = document.getElementById('search-bar').value.trim(); //
      const listElement = document.getElementById('document-list');
      
      if (!searchTerm) {
        listElement.innerHTML = `<p style='color:#A0A0A0; font-size:14px; text-align:center; padding:15px;'>Use the search bar above to find documents. For example, try typing 'maths'.</p>`;
        return;
      }
      
      let query = supabaseClient
        .from('documents')
        .select('*');

      query = query.ilike('title', `%${searchTerm}%`); //

      const { data: docs, error } = await query.order('id', { ascending: false });

      if (error || !docs || docs.length === 0) {
        listElement.innerHTML = `<p style='color:#A0A0A0; font-size:14px; text-align:center; padding:15px;'>No documents match your search.</p>`;
        return;
      }

      listElement.innerHTML = docs.map(doc => {
        const fileIcon = getFileIcon(doc.title);
        const avgRating = doc.rating_count > 0 ? doc.total_rating_score / doc.rating_count : 0;
        
        return `
          <div class="doc-item">
            <div class="file-icon">${fileIcon}</div>
            <div class="doc-details">
              <span class="doc-title">${doc.title}</span>
              <div class="doc-rating">
                ${getRatingStars(avgRating)}
              </div>
            </div>
            <div class="action-group">
              <button class="download-btn" onclick="handleDownload('${doc.file_url}')">Download (-1)</button>
              <div id="rate-voter-${doc.id}" style="font-size:10px; color:#A0A0A0; margin-top:5px; visibility: ${localStorage.getItem('studyShareCredits') > 0 || localStorage.getItem('studyShareProgress') > 0 ? 'visible' : 'hidden'}">
                Rate: <span class="star-rating" onclick="submitRating(${doc.id}, 5)">★</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleDownload(fileUrl) {
      if (userCredits <= 0) {
        alert("🔒 You have 0 credits! Upload unique study documents above to earn credits.");
        return;
      }

      userCredits -= 1;
      updateCreditDisplay();
      window.open(fileUrl, '_blank');
    }

    async function uploadAndUnlock() {
      const fileInput = document.getElementById('file-input');
      const message = document.getElementById('message');
      const file = fileInput.files[0];

      if (!file) {
        message.style.color = "#ef4444";
        message.innerText = "Please select a file to upload first!";
        return;
      }

      const allowedExtensions = ['pdf', 'docx', 'doc', 'txt', 'pptx'];
      const fileExtension = file.name.split('.').pop().toLowerCase();

      if (!allowedExtensions.includes(fileExtension)) {
        message.style.color = "#ef4444";
        message.innerText = "❌ Invalid file type! Please upload an educational document (.pdf, .docx, .txt, .pptx).";
        return;
      }

      const MAX_FILE_SIZE_BYTES = 5 * 1024 * 1024;
      if (file.size > MAX_FILE_SIZE_BYTES) {
        message.style.color = "#ef4444";
        message.innerText = "❌ File too large! Maximum allowed size is.";
        return;
      }

      message.style.color = "#90CDF4";
      message.innerText = "🔍 Checking file validity...";

      const { data: existingFiles, error: searchError } = await supabaseClient
        .from('documents')
        .select('id')
        .ilike('title', file.name); // '.ilike'

      const isDuplicate = existingFiles && existingFiles.length > 0;

      message.innerText = "⏳ Uploading your document...";

      const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, "_");
      const filePath = `uploads/${Date.now()}_${cleanFileName}`;
      
      const { data: storageData, error: storageError } = await supabaseClient.storage
        .from('study-files')
        .upload(filePath, file);

      if (storageError) {
        message.style.color = "#ef4444";
        message.innerText = "Upload failed: " + storageError.message;
        return;
      }

      const { data: urlData } = supabaseClient.storage
        .from('study-files')
        .getPublicUrl(filePath);

      const publicUrl = urlData.publicUrl;

      await supabaseClient
        .from('documents')
        .insert([{ title: file.name, file_url: publicUrl, total_rating_score: 0, rating_count: 0 }]);

      if (isDuplicate) {
        message.style.color = "#F6AD55"; 
        message.innerText = "⚠️ Duplicate file detected! File was saved, but NO credit progress awarded.";
      } else {
        userUploadProgress += 1; 

        if (userUploadProgress >= UPLOADS_PER_CREDIT) { 
          userCredits += 1; 
          userUploadProgress = 0; 
          
          message.style.color = "#68D391"; 
          message.innerText = "🎉 Upload successful! That was your 3rd file! +1 Download credit earned."; 
        } else {
          message.style.color = "#90CDF4"; 
          message.innerText = `📄 Upload successful! (File ${userUploadProgress}/${UPLOADS_PER_CREDIT}). Upload ${UPLOADS_PER_CREDIT - userUploadProgress} more to earn 1 credit.`; 
        }
        
        updateCreditDisplay();
      }

      fileInput.value = "";
      document.getElementById('file-name').innerText = "No file chosen";
    }

    function generateQRCode() {
      const qrcodeContainer = document.getElementById("qrcode");
      qrcodeContainer.innerHTML = ''; // Clear previous QR
      new QRCode(qrcodeContainer, {
        text: "https://davrazi123-stack.github.io/Studyshare/",
        width: 128,
        height: 128,
        colorDark : "#000000",
        colorLight : "#FFFFFF",
        correctLevel : QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
