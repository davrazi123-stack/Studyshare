<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyShare - Swap Study Notes</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .icon-header {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      color: #1e293b;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 28px;
    }

    /* Custom File Input Styling */
    .file-dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 30px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f8fafc;
      margin-bottom: 20px;
    }

    .file-dropzone:hover {
      border-color: #4f46e5;
      background: #f1f5f9;
    }

    .file-dropzone label {
      cursor: pointer;
      display: block;
      color: #475569;
      font-weight: 500;
    }

    input[type="file"] {
      display: none;
    }

    #file-name {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: #4f46e5;
      font-weight: 600;
      word-break: break-all;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #4338ca;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-success {
      background: #10b981;
    }
    .btn-success:hover {
      background: #059669;
    }

    /* Status Messages */
    #message {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 500;
    }

    .hidden { display: none; }

    /* Success Card */
    .success-box {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .success-box h3 {
      color: #065f46;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .success-box p {
      color: #047857;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-header">📚</div>
    <h1>StudyShare</h1>
    <p class="subtitle">Upload a study document to unlock community files!</p>
    
    <div id="upload-section">
      <div class="file-dropzone" onclick="document.getElementById('file-input').click()">
        <label>📄 Click to select your file</label>
        <span id="file-name">No file selected</span>
        <input type="file" id="file-input" onchange="updateFileName()" />
      </div>

      <button class="btn" onclick="uploadAndUnlock()">Upload & Unlock Access</button>
    </div>

   <div id="download-section" class="hidden">
  <div class="success-box">
    <h3>🎉 Document Unlocked!</h3>
    <p>Thank you for contributing! Here are all available study files:</p>
  </div>

  <div id="document-list" style="margin-top: 15px; text-align: left;">
    </div>
</div>

    <p id="message"></p>
  </div>

<script>
  // Supabase Configuration
  const SUPABASE_URL = "https://jskfhnjqzrfvnsnnivtt.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_ACTUAL_ANON_KEY_HERE"; 

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Load available documents when the page opens
  window.onload = fetchDocuments;

  function updateFileName() {
    const input = document.getElementById('file-input');
    const fileNameSpan = document.getElementById('file-name');
    if (input.files.length > 0) {
      fileNameSpan.innerText = input.files[0].name;
    }
  }

  // Fetch all uploaded documents from the database
  async function fetchDocuments() {
    const { data: docs, error } = await supabaseClient
      .from('documents')
      .select('*')
      .order('id', { ascending: false });

    const listElement = document.getElementById('document-list');
    if (!listElement) return;

    if (error || !docs || docs.length === 0) {
      listElement.innerHTML = "<p style='color:#64748b;'>No study files uploaded yet. Be the first!</p>";
      return;
    }

    listElement.innerHTML = docs.map(doc => `
      <div style="background:#f8fafc; padding:12px; border-radius:8px; margin-bottom:10px; display:flex; justify-between; align-items:center;">
        <span style="font-weight:600; color:#334155;">📄 ${doc.title}</span>
        <a href="${doc.file_url}" target="_blank" style="background:#10b981; color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:14px;">Download</a>
      </div>
    `).join('');
  }

  // Handle Upload and Insert Record into Database
  async function uploadAndUnlock() {
    const fileInput = document.getElementById('file-input');
    const message = document.getElementById('message');
    const file = fileInput.files[0];

    if (!file) {
      message.style.color = "#ef4444";
      message.innerText = "Please select a file to upload first!";
      return;
    }

    message.style.color = "#4f46e5";
    message.innerText = "⏳ Uploading your document...";

    const filePath = `uploads/${Date.now()}_${file.name}`;
    
    // 1. Upload to Storage
    const { data: storageData, error: storageError } = await supabaseClient.storage
      .from('study-files')
      .upload(filePath, file);

    if (storageError) {
      message.style.color = "#ef4444";
      message.innerText = "Upload failed: " + storageError.message;
      return;
    }

    // 2. Get Public URL for the file
    const { data: urlData } = supabaseClient.storage
      .from('study-files')
      .getPublicUrl(filePath);

    const publicUrl = urlData.publicUrl;

    // 3. Insert record into Database Table
    const { error: dbError } = await supabaseClient
      .from('documents')
      .insert([{ title: file.name, file_url: publicUrl }]);

    if (dbError) {
      message.style.color = "#ef4444";
      message.innerText = "Database save failed: " + dbError.message;
    } else {
      message.innerText = "";
      
      // Unlock the download list!
      document.getElementById('upload-section').classList.add('hidden');
      document.getElementById('download-section').classList.remove('hidden');
      
      // Refresh the available documents list
      fetchDocuments();
    }
  }
</script>
