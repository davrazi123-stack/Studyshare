<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyShare - Swap Study Notes</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .icon-header {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      color: #1e293b;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 28px;
    }

    /* Custom File Input Styling */
    .file-dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 30px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f8fafc;
      margin-bottom: 20px;
    }

    .file-dropzone:hover {
      border-color: #4f46e5;
      background: #f1f5f9;
    }

    .file-dropzone label {
      cursor: pointer;
      display: block;
      color: #475569;
      font-weight: 500;
    }

    input[type="file"] {
      display: none;
    }

    #file-name {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: #4f46e5;
      font-weight: 600;
      word-break: break-all;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #4338ca;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-success {
      background: #10b981;
    }
    .btn-success:hover {
      background: #059669;
    }

    /* Status Messages */
    #message {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 500;
    }

    .hidden { display: none; }

    /* Success Card */
    .success-box {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .success-box h3 {
      color: #065f46;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .success-box p {
      color: #047857;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-header">📚</div>
    <h1>StudyShare</h1>
    <p class="subtitle">Upload a study document to unlock community files!</p>
    
    <div id="upload-section">
      <div class="file-dropzone" onclick="document.getElementById('file-input').click()">
        <label>📄 Click to select your file</label>
        <span id="file-name">No file selected</span>
        <input type="file" id="file-input" onchange="updateFileName()" />
      </div>

      <button class="btn" onclick="uploadAndUnlock()">Upload & Unlock Access</button>
    </div>

    <div id="download-section" class="hidden">
      <div class="success-box">
        <h3>🎉 Document Unlocked!</h3>
        <p>Thank you for contributing! You now have access to download files.</p>
      </div>

      <a id="download-link" href="#" target="_blank" style="text-decoration: none;">
        <button class="btn btn-success">Download Sample Notes</button>
      </a>
    </div>

    <p id="message"></p>
  </div>

 <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://jskfhnjqzrfvnsnnivtt.supabase.co";
    // MAKE SURE YOUR ACTUAL ANON KEY IS INSIDE THESE QUOTES:
    const SUPABASE_ANON_KEY = "YOUR_ACTUAL_ANON_KEY_HERE"; 

    // Initialize Supabase Client with a distinct variable name
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Display selected file name
    function updateFileName() {
      const input = document.getElementById('file-input');
      const fileNameSpan = document.getElementById('file-name');
      if (input.files.length > 0) {
        fileNameSpan.innerText = input.files[0].name;
      }
    }

    // Handle File Upload Logic
    async function uploadAndUnlock() {
      const fileInput = document.getElementById('file-input');
      const message = document.getElementById('message');
      const file = fileInput.files[0];

      if (!file) {
        message.style.color = "#ef4444";
        message.innerText = "Please select a file to upload first!";
        return;
      }

      message.style.color = "#4f46e5";
      message.innerText = "⏳ Uploading your document...";

      const filePath = `uploads/${Date.now()}_${file.name}`;
      
      // Using supabaseClient here
      const { data, error } = await supabaseClient.storage
        .from('study-files')
        .upload(filePath, file);

      if (error) {
        message.style.color = "#ef4444";
        message.innerText = "Upload failed: " + error.message;
        console.error("Supabase Error:", error);
      } else {
        message.innerText = "";
        
        // Hide upload container & show unlocked area
        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('download-section').classList.remove('hidden');
      }
    }
  </script>
</html>
