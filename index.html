<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyShare - Swap Study Notes</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .icon-header { font-size: 48px; margin-bottom: 12px; }
    h1 { color: #1e293b; font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    p.subtitle { color: #64748b; font-size: 15px; margin-bottom: 20px; }

    /* Credit Badge */
    .credit-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Dropzone */
    .file-dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 25px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f8fafc;
      margin-bottom: 18px;
    }
    .file-dropzone:hover { border-color: #4f46e5; background: #f1f5f9; }
    .file-dropzone label { cursor: pointer; display: block; color: #475569; font-weight: 500; }
    input[type="file"] { display: none; }
    #file-name { display: block; margin-top: 8px; font-size: 13px; color: #4f46e5; font-weight: 600; word-break: break-all; }

    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #4338ca; }

    #message { margin-top: 15px; font-size: 14px; font-weight: 500; }

    .doc-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }
    .doc-title { font-weight: 600; color: #334155; font-size: 14px; word-break: break-all; padding-right: 10px; }
    .download-btn {
      background: #10b981;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .download-btn:hover { background: #059669; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-header">📚</div>
    <h1>StudyShare</h1>
    <p class="subtitle">1 Upload = 1 Download Token!</p>
    
    <div class="credit-badge">
      ⚡ Available Downloads: <span id="credit-count">0</span>
    </div>

    <div id="upload-section">
      <div class="file-dropzone" onclick="document.getElementById('file-input').click()">
        <label>📄 Select a document to upload (+1 Download Credit)</label>
        <span id="file-name">No file chosen</span>
        <input type="file" id="file-input" onchange="updateFileName()" />
      </div>

      <button class="btn" onclick="uploadAndUnlock()">Upload Document</button>
    </div>

    <p id="message"></p>

    <hr style="margin: 25px 0; border: none; border-top: 1px solid #e2e8f0;" />

    <h3 style="text-align: left; font-size: 16px; color: #1e293b; margin-bottom: 12px;">Available Documents:</h3>
    <div id="document-list">
      </div>
  </div>

  <script>
    // Supabase Setup
    const SUPABASE_URL = "https://jskfhnjqzrfvnsnnivtt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impza2ZobmpxenJmdm5zbm5pdnR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjE5MjAsImV4cCI6MjEwMTI5NzkyMH0.oKMohbhY9cNvr7Rt7iLgea_hg48y1zzaFTcK0wj53YU"; // <-- Keep your actual key here

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initialize credits from local browser storage
    let userCredits = parseInt(localStorage.getItem('studyShareCredits')) || 0;

    window.onload = function() {
      updateCreditDisplay();
      fetchDocuments();
    };

    function updateCreditDisplay() {
      document.getElementById('credit-count').innerText = userCredits;
      localStorage.setItem('studyShareCredits', userCredits);
    }

    function updateFileName() {
      const input = document.getElementById('file-input');
      const fileNameSpan = document.getElementById('file-name');
      if (input.files.length > 0) {
        fileNameSpan.innerText = input.files[0].name;
      }
    }

    // Fetch documents and attach credit-check logic to download buttons
    async function fetchDocuments() {
      const { data: docs, error } = await supabaseClient
        .from('documents')
        .select('*')
        .order('id', { ascending: false });

      const listElement = document.getElementById('document-list');

      if (error || !docs || docs.length === 0) {
        listElement.innerHTML = "<p style='color:#64748b; font-size:14px;'>No documents available yet.</p>";
        return;
      }

      listElement.innerHTML = docs.map(doc => `
        <div class="doc-item">
          <span class="doc-title">📄 ${doc.title}</span>
          <button class="download-btn" onclick="handleDownload('${doc.file_url}')">Download (-1)</button>
        </div>
      `).join('');
    }

    // Handle Download Credit Deduction
    function handleDownload(fileUrl) {
      if (userCredits <= 0) {
        alert("🔒 You have 0 download credits left! Please upload a study document above to earn 1 download credit.");
        return;
      }

      // Deduct 1 credit and update display
      userCredits -= 1;
      updateCreditDisplay();

      // Trigger file download
      window.open(fileUrl, '_blank');
    }

    // Handle Upload and Add +1 Credit
    async function uploadAndUnlock() {
      const fileInput = document.getElementById('file-input');
      const message = document.getElementById('message');
      const file = fileInput.files[0];

      if (!file) {
        message.style.color = "#ef4444";
        message.innerText = "Please select a file to upload first!";
        return;
      }

      message.style.color = "#4f46e5";
      message.innerText = "⏳ Uploading your document...";

      const cleanFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, "_");
      const filePath = `uploads/${Date.now()}_${cleanFileName}`;
      
      // 1. Storage Upload
      const { data: storageData, error: storageError } = await supabaseClient.storage
        .from('study-files')
        .upload(filePath, file);

      if (storageError) {
        message.style.color = "#ef4444";
        message.innerText = "Upload failed: " + storageError.message;
        return;
      }

      // 2. Get Public Link
      const { data: urlData } = supabaseClient.storage
        .from('study-files')
        .getPublicUrl(filePath);

      const publicUrl = urlData.publicUrl;

      // 3. Database Save
      const { error: dbError } = await supabaseClient
        .from('documents')
        .insert([{ title: file.name, file_url: publicUrl }]);

      if (dbError) {
        message.style.color = "#ef4444";
        message.innerText = "Database error: " + dbError.message;
      } else {
        message.style.color = "#10b981";
        message.innerText = "🎉 Upload successful! +1 Download credit earned.";
        
        // Add 1 Credit
        userCredits += 1;
        updateCreditDisplay();

        // Reset file input and refresh list
        fileInput.value = "";
        document.getElementById('file-name').innerText = "No file chosen";
        fetchDocuments();
      }
    }
  </script>
</body>
</html>
